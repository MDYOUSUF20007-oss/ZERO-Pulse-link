[package]
name = "desktop-server"
version = "0.1.0"
edition = "2021"
description = "Zero Pulse Link Desktop Audio Server - Lossless & Low-Latency PC Audio Broadcaster"

[dependencies]
protocol-common = { path = "../protocol-common" }
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "sync", "time", "macros", "process", "io-util"] }
cpal = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
thiserror = "1.0"
anyhow = "1.0"
socket2 = { version = "0.5", features = ["all"] }
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
log = "0.4"
env_logger = "0.11"


