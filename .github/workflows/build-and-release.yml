name: Build and Release Zero Pulse Link

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Desktop Server Binary (Release)
        run: cargo build --release -p desktop-server

      - name: Prepare Windows Executable
        shell: bash
        run: |
          cp target/release/desktop-server.exe ZeroPulseLink-Windows-x86_64.exe

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPulseLink-Windows-x86_64
          path: ZeroPulseLink-Windows-x86_64.exe
          if-no-files-found: error

  build-android-apk:
    name: Build Android Mobile Client (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Configure Android SDK Permissions and Tools
        run: |
          sudo chown -R runner:runner $ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1.4909473" "platforms;android-34" "build-tools;34.0.0" || true
          mkdir -p $ANDROID_HOME/ndk
          ln -sfn ${{ steps.setup-ndk.outputs.ndk-path }} $ANDROID_HOME/ndk/26.1.10909125

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build Android APK
        working-directory: android-client
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log || (echo "=== BUILD ERROR ===" && tail -n 100 ../build.log && exit 1)

      - name: Prepare APK Artifact
        run: |
          find android-client/app/build/outputs/apk -name "*.apk" -exec cp {} ZeroPulseLink-Android.apk \;

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroPulseLink-Android-APK
          path: ZeroPulseLink-Android.apk
          if-no-files-found: warn

  publish-pre-release:
    name: Create GitHub Pre-Release
    needs: [build-desktop-windows, build-android-apk]
    if: always() && (needs.build-desktop-windows.result == 'success' || needs.build-android-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        if: needs.build-desktop-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ZeroPulseLink-Windows-x86_64

      - name: Download Android Artifact
        if: needs.build-android-apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ZeroPulseLink-Android-APK

      - name: List Release Files
        run: ls -la

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-pre
          name: "Zero Pulse Link v1.0.0-pre (Lossless Audio Suite)"
          prerelease: true
          draft: false
          files: |
            ZeroPulseLink-Windows-x86_64.exe
            ZeroPulseLink-Android.apk
          fail_on_unmatched_files: false
          body: |
            # ⚡ Zero Pulse Link v1.0.0-pre

            Turn your smartphone into a lossless wireless & wired PC speaker with sub-10ms latency.

            ### 📦 Download Pre-Compiled Binaries:
            * **Windows PC Executable**: [`ZeroPulseLink-Windows-x86_64.exe`](https://github.com/${{ github.repository }}/releases/download/v1.0.0-pre/ZeroPulseLink-Windows-x86_64.exe)
            * **Android Mobile App**: [`ZeroPulseLink-Android.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.0-pre/ZeroPulseLink-Android.apk)

            ---

            ### 🌟 Key Highlights:
            * **100% Free & Open-Source (MIT)**: Zero paywalls, zero ads, and zero artificial limits.
            * **Zero Data Collection**: No telemetry recorded, no audio stored, strictly peer-to-peer over local network/USB.
            * **Lossless Quality**: 16-bit & 24-bit PCM at 44.1kHz, 48kHz, and 96kHz.
            * **One-Click USB ADB Mode**: <5ms latency over USB cable without carrier tethering plan restrictions.
            * **Multi-Device Stereo Routing**: Use two phones as dedicated Left and Right desk monitors.
            * **Soft-Clipping Volume Boost**: Up to +15dB boost with analogue-style soft limiting.
